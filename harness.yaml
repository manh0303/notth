{
  "schema_version": 1,
  "name": "notth",
  "version": "0.19.0",
  "adapters": [
    "java-spring",
    "react-nextjs",
    "react-native",
    "ai-python",
    "kubernetes",
    "astro"
  ],
  "runtime": {
    "node": ">=22",
    "dependencies": []
  },
  "format": "JSON-compatible YAML 1.2; intentionally parsed with JSON.parse",
  "capabilities": [
    "uiux",
    "product",
    "devops",
    "monetization",
    "architecture",
    "delivery",
    "analysis",
    "discovery"
  ],
  "distribution": {
    "npm": "@manhd_d/notth",
    "pypi": "notth",
    "python": ">=3.9",
    "node": ">=22",
    "shared_payload": "package.json files allowlist",
    "python_runtime_dependencies": []
  },
  "workflow_contracts": [
    "core/workflows/spec-to-code.workflow.json",
    "capabilities/product/workflows/idea-to-prd.workflow.json"
  ],
  "project_directory": ".notth"
}
